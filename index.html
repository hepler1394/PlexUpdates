<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request Movies for Plex</title>
<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  /* --- PREMIUM STYLE BASE --- */
  :root {
    --bg-primary: #0a0a0f;
    --bg-secondary: #12121a;
    --bg-card: #16161f;
    --bg-card-hover: #1c1c28;
    --border: #2a2a3a;
    --border-hover: #3a3a5a;
    --text-primary: #eeeef0;
    --text-secondary: #9898a8;
    --text-muted: #68687a;
    
    /* RED TONE */
    --accent: #e50914; 
    --accent-glow: rgba(229, 9, 20, 0.3);
    
    --green: #00d26a;
    --green-neon: #00ff7f;
    --red: #ff4757;
    --blue: #0984e3;
    --yellow: #f1c40f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    padding-bottom: 80px;
  }

  /* --- HEADER & TABS --- */
  header {
    background: rgba(10, 10, 15, 0.95);
    padding: 20px 0 0 0;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
  }

  .header-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    margin-bottom: 15px;
  }

  h1 {
    font-size: 1.8rem;
    font-weight: 800;
    background: linear-gradient(135deg, #fff 0%, var(--text-secondary) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center;
  }

  .tabs {
    display: flex;
    gap: 10px;
    background: var(--bg-secondary);
    padding: 5px;
    border-radius: 12px;
    border: 1px solid var(--border);
    margin-bottom: 15px;
  }

  .tab-btn {
    padding: 10px 25px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    font-size: 0.95rem;
  }

  .tab-btn.active {
    background: var(--accent); /* Red active tab */
    color: white;
    box-shadow: 0 2px 10px var(--accent-glow);
  }

  .tab-badge {
    background: white;
    color: var(--accent);
    font-size: 0.75rem;
    padding: 2px 6px;
    border-radius: 6px;
    margin-left: 6px;
    display: inline-block;
    font-weight: 800;
  }

  /* Search Bar */
  .search-container {
    width: 100%;
    max-width: 600px;
    position: relative;
    margin-bottom: 15px;
    display: block;
  }
  
  .search-container.hidden { display: none; }

  .search-input {
    width: 100%;
    padding: 14px 24px;
    padding-left: 45px;
    border-radius: 12px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    color: var(--text-primary);
    font-size: 1rem;
    font-family: inherit;
    transition: all 0.3s ease;
  }

  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-glow);
    background: var(--bg-card);
  }

  .search-icon {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-secondary);
    pointer-events: none;
  }

  /* --- VIEWS --- */
  .view-section {
    display: none;
    animation: fadeIn 0.3s ease;
  }
  .view-section.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .section-header {
    margin: 30px 0 20px 0;
    color: var(--text-secondary);
    font-size: 1.1rem;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* --- MOVIE GRID --- */
  .movie-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 20px;
  }

  .movie-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    position: relative;
  }

  .movie-card:hover {
    transform: translateY(-5px);
    border-color: var(--border-hover);
    box-shadow: 0 15px 30px rgba(0,0,0,0.4);
  }

  /* NEON GREEN GLOW for "Added" movies */
  .movie-card.library-item {
    border: 1px solid var(--green-neon);
    box-shadow: 0 0 12px rgba(0, 255, 127, 0.4), inset 0 0 5px rgba(0, 255, 127, 0.2);
  }
  
  .movie-card.library-item .rating-badge {
    background: var(--green);
    color: #000;
    border: none;
  }

  .poster-wrapper {
    position: relative;
    aspect-ratio: 2/3;
    overflow: hidden;
    background: var(--bg-secondary);
  }

  .poster-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
  }

  .movie-card:hover .poster-img { transform: scale(1.05); }

  .rating-badge {
    position: absolute;
    top: 8px; right: 8px;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(4px);
    color: var(--green);
    padding: 3px 6px;
    border-radius: 4px;
    font-size: 0.8rem;
    font-weight: 700;
    border: 1px solid rgba(0, 210, 106, 0.3);
  }

  .card-content {
    padding: 12px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
  }

  .movie-title {
    font-size: 0.95rem;
    font-weight: 600;
    margin-bottom: 4px;
    line-height: 1.3;
    color: var(--text-primary);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .movie-year {
    color: var(--text-muted);
    font-size: 0.8rem;
    margin-bottom: 12px;
  }

  /* Action Buttons */
  .btn-wrapper {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 2;
  }

  .btn-card-action {
    width: 100%;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-secondary);
    color: var(--text-secondary);
    cursor: pointer;
    font-weight: 600;
    font-size: 0.85rem;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn-card-action:hover { background: var(--border); color: white; }

  /* Mark Added Button (Top) */
  .btn-mark-added {
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--text-muted);
    font-size: 0.75rem;
    padding: 6px;
  }
  .btn-mark-added:hover {
    border-color: var(--green);
    color: var(--green);
    background: rgba(0, 210, 106, 0.05);
  }

  /* States */
  .btn-card-action.added {
    background: rgba(229, 9, 20, 0.1); /* Red tint */
    border-color: var(--accent);
    color: var(--accent);
    cursor: default;
  }
  
  .btn-card-action.torrent {
    background: var(--blue);
    color: white;
    border-color: var(--blue);
  }
  .btn-card-action.torrent:hover {
    background: #0870c0;
  }

  /* --- DETAIL MODAL --- */
  .detail-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.9);
    backdrop-filter: blur(8px);
    z-index: 1000;
    display: none;
    opacity: 0;
    transition: opacity 0.3s;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow-y: auto;
  }

  .detail-overlay.open { display: flex; opacity: 1; }

  .detail-modal {
    background: var(--bg-card);
    width: 100%;
    max-width: 900px;
    border-radius: 20px;
    border: 1px solid var(--border);
    box-shadow: 0 50px 100px rgba(0,0,0,0.7);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* Torrent Modal Specifics */
  .torrent-modal-size {
    max-width: 500px;
  }

  .torrent-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 20px;
    background: var(--bg-secondary);
  }

  .torrent-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 600;
    transition: transform 0.2s;
    color: white;
  }
  .torrent-btn:hover { transform: scale(1.02); }
  
  .btn-yts { background: #2f3640; border: 1px solid #4cd137; color: #4cd137; }
  .btn-1337x { background: #2f3640; border: 1px solid #e84118; color: #e84118; }
  .btn-galaxy { background: #2f3640; border: 1px solid #9c88ff; color: #9c88ff; }
  .btn-google { background: #2f3640; border: 1px solid #00a8ff; color: #00a8ff; }
  .btn-copy-name { background: var(--bg-card); border: 1px dashed var(--text-muted); color: var(--text-primary); cursor: pointer; }

  .detail-backdrop {
    height: 250px;
    width: 100%;
    background-size: cover;
    background-position: center;
    position: relative;
  }
  
  .detail-backdrop::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 100%;
    background: linear-gradient(to bottom, transparent 0%, var(--bg-card) 100%);
  }

  .detail-close {
    position: absolute;
    top: 15px; right: 15px;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.1);
    color: white;
    width: 36px; height: 36px;
    border-radius: 50%;
    cursor: pointer;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .detail-content {
    padding: 25px;
    margin-top: -60px;
    position: relative;
    z-index: 5;
    display: flex;
    gap: 30px;
  }

  .detail-poster {
    width: 200px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    flex-shrink: 0;
    border: 1px solid var(--border);
  }

  .detail-info { flex-grow: 1; color: var(--text-primary); }
  .detail-title { font-size: 2rem; font-weight: 800; margin-bottom: 5px; line-height: 1.1; }
  .detail-meta { display: flex; gap: 15px; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
  .meta-tag { background: var(--bg-secondary); padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); }
  .detail-overview { line-height: 1.6; color: #ccc; margin-bottom: 25px; font-size: 1rem; }
  
  .detail-actions { display: flex; gap: 15px; margin-top: 20px; }
  
  .btn-big {
    padding: 12px 30px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    border: none;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: transform 0.2s;
  }
  .btn-big:active { transform: scale(0.98); }
  .btn-primary { background: var(--accent); color: white; }
  .btn-success { background: var(--green); color: white; }
  .btn-disabled { background: var(--bg-secondary); color: var(--text-muted); cursor: default; }

  /* Config Notice */
  .config-notice {
    background: var(--red);
    color: white;
    padding: 20px;
    text-align: center;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 9999;
    font-weight: bold;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .detail-content { flex-direction: column; gap: 20px; margin-top: -40px; }
    .detail-poster { width: 140px; margin: 0 auto; display: block; }
    .detail-info { text-align: center; }
    .detail-meta { justify-content: center; }
    .detail-actions { justify-content: center; }
    .movie-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
  }
</style>
</head>
<body>

  <header>
    <div class="container header-content">
      <h1><i class="fa-solid fa-film"></i> Movie Requests</h1>
      
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('discover')">
          <i class="fa-solid fa-compass"></i> Discover
        </button>
        <button class="tab-btn" onclick="switchTab('requests')">
          <i class="fa-solid fa-list-check"></i> Requests
          <span class="tab-badge" id="tab-count">0</span>
        </button>
      </div>

      <div class="search-container" id="search-bar-container">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="search" class="search-input" placeholder="Search for movies...">
      </div>
    </div>
  </header>

  <main class="container">
    
    <!-- DISCOVER VIEW -->
    <div id="view-discover" class="view-section active">
      <div id="section-header" class="section-header"><i class="fa-solid fa-fire"></i> Trending This Week</div>
      <div id="loader" class="loader" style="display:none; text-align:center; padding:40px;"><i class="fa-solid fa-circle-notch fa-spin fa-2x"></i></div>
      <div id="grid-discover" class="movie-grid"></div>
    </div>

    <!-- REQUESTS VIEW -->
    <div id="view-requests" class="view-section">
      <div class="section-header">
        <span><i class="fa-solid fa-users"></i> Community Requests</span>
        <span id="req-count" style="font-size: 0.9rem; color: var(--text-muted);">0 items</span>
      </div>
      <div id="grid-requests" class="movie-grid"></div>
    </div>

  </main>

  <!-- DETAIL MODAL -->
  <div class="detail-overlay" id="detail-overlay">
    <div class="detail-modal" id="detail-modal-content">
      <!-- Injected via JS -->
    </div>
  </div>

  <!-- TORRENT SELECTION MODAL -->
  <div class="detail-overlay" id="torrent-overlay">
    <div class="detail-modal torrent-modal-size" id="torrent-modal-content">
      <!-- Injected via JS -->
    </div>
  </div>

  <div id="config-alert" class="config-notice" style="display:none;">
    ⚠️ Database Not Connected! Edit index.html and paste your Firebase Config keys.
  </div>

<!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getFirestore, collection, addDoc, doc, setDoc, onSnapshot, query, orderBy, deleteDoc } from "
