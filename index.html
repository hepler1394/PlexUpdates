<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plex Request Portal</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #16161f;
      --bg-card-hover: #1c1c28;
      --border: #2a2a3a;
      --border-hover: #3a3a5a;
      --text-primary: #eeeef0;
      --text-secondary: #9898a8;
      --text-muted: #68687a;
      --accent: #e50914;
      /* Netflix/Plex Red */
      --accent-glow: rgba(229, 9, 20, 0.4);
      --green: #00d26a;
      --green-neon: #39ff14;
      /* Neon Green for Added items */
      --blue: #0984e3;
      --purple: #a29bfe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      outline: none;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding-bottom: 80px;
      overflow-x: hidden;
    }

    /* --- HEADER & NAVIGATION --- */
    header {
      background: rgba(10, 10, 15, 0.95);
      padding: 20px 0 0 0;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .header-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, #888 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -1px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      background: var(--bg-secondary);
      padding: 6px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 12px 28px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tab-btn.active {
      background: var(--accent);
      color: white;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    .tab-badge {
      background: white;
      color: var(--accent);
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: 900;
    }

    .search-container {
      width: 100%;
      max-width: 600px;
      position: relative;
      margin-bottom: 15px;
    }

    .search-container.hidden {
      display: none;
    }

    .search-input {
      width: 100%;
      padding: 16px 24px;
      padding-left: 50px;
      border-radius: 14px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 1rem;
      transition: border 0.3s;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .search-icon {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    /* --- CONTROLS --- */
    .controls-bar {
      display: flex;
      gap: 12px;
      margin: 20px 0;
      padding: 15px;
      background: var(--bg-card);
      border-radius: 14px;
      border: 1px solid var(--border);
      flex-wrap: wrap;
      align-items: center;
    }

    .control-select {
      padding: 10px 15px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-radius: 10px;
      font-family: inherit;
      cursor: pointer;
    }

    .control-btn {
      padding: 10px 20px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* --- STATS DASHBOARD --- */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin: 20px 0;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      text-align: center;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 5px;
    }

    .stat-label {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    /* --- GRID SYSTEM --- */
    .view-section {
      display: none;
      animation: fadeIn 0.4s ease;
    }

    .view-section.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .section-header {
      margin: 30px 0 20px 0;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 25px;
      margin-top: 10px;
    }

    .movie-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.3s ease, border 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      position: relative;
      cursor: pointer;
    }

    .movie-card:hover {
      transform: translateY(-8px);
      border-color: var(--border-hover);
    }

    /* PERSISTENT NEON GLOW for Added items */
    .movie-card.library-item {
      border: 2px solid var(--green-neon);
      box-shadow: 0 0 20px rgba(57, 255, 20, 0.25);
    }

    .poster-wrapper {
      position: relative;
      aspect-ratio: 2/3;
      background: #000;
      overflow: hidden;
    }

    .poster-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .movie-card:hover .poster-img {
      transform: scale(1.05);
    }

    .rating-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.85);
      color: var(--green);
      padding: 5px 8px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 800;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .priority-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(229, 9, 20, 0.95);
      color: white;
      padding: 5px 8px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 800;
    }

    .card-content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .movie-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 5px;
      color: var(--text-primary);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .movie-year {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 8px;
    }

    .movie-note {
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-style: italic;
      margin-bottom: 10px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* --- BUTTONS --- */
    .btn-wrapper {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-card {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text-secondary);
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-mark-added {
      background: transparent;
      border: 1px dashed var(--text-muted);
      font-size: 0.8rem;
    }

    .btn-mark-added:hover {
      color: var(--green-neon);
      border-color: var(--green-neon);
      background: rgba(57, 255, 20, 0.05);
    }

    .btn-request:hover {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .btn-status-requested {
      background: rgba(229, 9, 20, 0.1);
      border-color: var(--accent);
      color: var(--accent);
      cursor: default;
    }

    .btn-status-available {
      background: var(--green-neon);
      color: black;
      border-color: var(--green-neon);
      cursor: default;
    }

    /* --- MODALS --- */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .overlay.open {
      display: flex;
    }

    .modal {
      background: var(--bg-card);
      width: 100%;
      max-width: 800px;
      border-radius: 28px;
      border: 1px solid var(--border);
      overflow: hidden;
      position: relative;
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.7);
    }

    .modal-backdrop {
      height: 280px;
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .modal-backdrop::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 20%, var(--bg-card) 100%);
    }

    .modal-content {
      padding: 0 40px 40px 40px;
      display: flex;
      gap: 40px;
      margin-top: -120px;
      position: relative;
      z-index: 1;
    }

    .modal-poster {
      width: 200px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      flex-shrink: 0;
    }

    .modal-info {
      flex: 1;
      padding-top: 60px;
    }

    .modal-info h2 {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .modal-info p {
      color: var(--text-secondary);
      line-height: 1.6;
      font-size: 1rem;
      margin-bottom: 20px;
    }

    .modal-note-input {
      width: 100%;
      padding: 12px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-primary);
      font-family: inherit;
      margin-bottom: 15px;
      resize: vertical;
    }

    .torrent-btn {
      display: inline-flex;
      padding: 14px 28px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      background: var(--blue);
      color: white;
      align-items: center;
      gap: 10px;
      transition: transform 0.2s;
      border: none;
      cursor: pointer;
    }

    .torrent-btn:hover {
      transform: scale(1.03);
    }

    .torrent-hub-modal {
      max-width: 500px;
      padding: 30px;
    }

    .hub-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    .hub-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 14px;
      text-decoration: none;
      color: white;
      font-weight: 600;
      transition: all 0.2s;
    }

    .hub-item:hover {
      border-color: var(--text-secondary);
      background: var(--bg-card-hover);
    }

    .loader {
      display: flex;
      justify-content: center;
      padding: 100px;
      color: var(--accent);
    }

    @media (max-width: 768px) {
      .movie-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
      }

      .modal-content {
        flex-direction: column;
        align-items: center;
        margin-top: -60px;
        text-align: center;
        padding: 20px;
      }

      .modal-info {
        padding-top: 0;
      }

      .modal-poster {
        width: 150px;
      }

      h1 {
        font-size: 1.8rem;
      }

      .controls-bar {
        flex-direction: column;
        align-items: stretch;
      }

      .control-select,
      .control-btn {
        width: 100%;
      }

      .tabs {
        justify-content: center;
        gap: 6px;
      }

      .tab-btn {
        padding: 10px 16px;
        font-size: 0.9rem;
      }

      .btn-card {
        min-height: 44px;
        /* Minimum touch target size */
        font-size: 0.9rem;
      }

      .rating-badge,
      .priority-badge {
        font-size: 0.75rem;
        padding: 4px 6px;
      }

      .torrent-btn {
        padding: 12px 20px;
        font-size: 0.9rem;
        width: 100%;
        /* Full width on mobile */
        justify-content: center;
      }

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .header-content {
        gap: 10px;
      }

      #last-updated {
        font-size: 0.75rem !important;
      }

      body {
        padding-bottom: 40px;
      }
    }

    /* Extra small devices */
    @media (max-width: 480px) {
      .movie-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .movie-card {
        border-radius: 12px;
      }

      h1 {
        font-size: 1.5rem;
      }

      .tab-btn {
        padding: 8px 12px;
        font-size: 0.85rem;
      }

      .tab-badge {
        font-size: 0.7rem;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="container header-content">
      <h1><i class="fa-solid fa-clapperboard"></i> Plex Hub</h1>
      <p style="color: var(--text-secondary); font-size: 1.1rem; margin-top: -10px;">Request Movies For Corys Plex</p>
      <p id="last-updated" style="color: var(--text-muted); font-size: 0.85rem; margin-top: -5px;">
        <i class="fa-solid fa-clock"></i> Last Updated: <span id="update-time">Loading...</span>
      </p>
      <div class="tabs">
        <button class="tab-btn active" id="tab-movies-btn" onclick="switchTab('movies')"><i
            class="fa-solid fa-film"></i> Movies</button>
        <button class="tab-btn" id="tab-tvshows-btn" onclick="switchTab('tvshows')"><i class="fa-solid fa-tv"></i> TV
          Shows</button>
        <button class="tab-btn" id="tab-coming-btn" onclick="switchTab('coming')"><i
            class="fa-solid fa-calendar-star"></i> Coming Soon</button>
        <button class="tab-btn" id="tab-requests-btn" onclick="switchTab('requests')"><i
            class="fa-solid fa-list-check"></i> Requests <span class="tab-badge" id="tab-count">0</span></button>
        <button class="tab-btn" id="tab-stats-btn" onclick="switchTab('stats')"><i class="fa-solid fa-chart-pie"></i>
          Stats</button>
      </div>
      <div class="search-container" id="search-box">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="search" class="search-input" placeholder="Search...">
      </div>
    </div>
  </header>

  <main class="container">
    <!-- MOVIES SECTION -->
    <div id="view-movies" class="view-section active">
      <div class="controls-bar">
        <select id="movie-sort" class="control-select">
          <option value="trending">Trending</option>
          <option value="rating">By Rating</option>
          <option value="year">By Year</option>
          <option value="title">By Title</option>
        </select>
        <select id="movie-genre" class="control-select">
          <option value="">All Genres</option>
          <option value="28">Action</option>
          <option value="12">Adventure</option>
          <option value="16">Animation</option>
          <option value="35">Comedy</option>
          <option value="80">Crime</option>
          <option value="18">Drama</option>
          <option value="14">Fantasy</option>
          <option value="27">Horror</option>
          <option value="878">Sci-Fi</option>
          <option value="53">Thriller</option>
        </select>
      </div>
      <div class="section-header" id="movie-header"><i class="fa-solid fa-fire"></i> Trending Movies</div>
      <div id="loader-movies" class="loader"><i class="fa-solid fa-circle-notch fa-spin fa-3x"></i></div>
      <div id="grid-movies" class="movie-grid"></div>
    </div>

    <!-- TV SHOWS SECTION -->
    <div id="view-tvshows" class="view-section">
      <div class="controls-bar">
        <select id="tv-sort" class="control-select">
          <option value="trending">Trending</option>
          <option value="rating">By Rating</option>
          <option value="year">By Year</option>
          <option value="title">By Title</option>
        </select>
        <select id="tv-genre" class="control-select">
          <option value="">All Genres</option>
          <option value="10759">Action & Adventure</option>
          <option value="16">Animation</option>
          <option value="35">Comedy</option>
          <option value="80">Crime</option>
          <option value="99">Documentary</option>
          <option value="18">Drama</option>
          <option value="10765">Sci-Fi & Fantasy</option>
        </select>
      </div>
      <div class="section-header" id="tv-header"><i class="fa-solid fa-fire"></i> Trending TV Shows</div>
      <div id="loader-tv" class="loader"><i class="fa-solid fa-circle-notch fa-spin fa-3x"></i></div>
      <div id="grid-tvshows" class="movie-grid"></div>
    </div>

    <!-- COMING SOON SECTION -->
    <div id="view-coming" class="view-section">
      <div class="section-header"><i class="fa-solid fa-calendar-star"></i> Upcoming Releases</div>
      <div id="loader-coming" class="loader"><i class="fa-solid fa-circle-notch fa-spin fa-3x"></i></div>
      <div id="grid-coming" class="movie-grid"></div>
    </div>

    <!-- REQUESTS SECTION -->
    <div id="view-requests" class="view-section">
      <div class="controls-bar">
        <select id="requests-filter" class="control-select" onchange="updateUI()">
          <option value="all">All Requests</option>
          <option value="pending">Pending Only</option>
          <option value="added">Available Only</option>
        </select>
        <select id="requests-sort" class="control-select" onchange="updateUI()">
          <option value="newest">Newest First</option>
          <option value="oldest">Oldest First</option>
          <option value="title">By Title</option>
          <option value="priority">By Priority</option>
        </select>
        <button class="control-btn" onclick="copyRequestList()"><i class="fa-solid fa-copy"></i> Copy List</button>
        <button class="control-btn" onclick="bulkMarkAvailable()"><i class="fa-solid fa-check-double"></i> Bulk Mark
          Available</button>
      </div>
      <div class="section-header"><i class="fa-solid fa-users-viewfinder"></i> Community Requests</div>
      <div id="grid-requests" class="movie-grid"></div>
    </div>

    <!-- STATS SECTION -->
    <div id="view-stats" class="view-section">
      <div class="section-header"><i class="fa-solid fa-chart-line"></i> Request Statistics</div>
      <div class="stats-grid" id="stats-container"></div>
    </div>
  </main>

  <!-- MOVIE/TV DETAIL MODAL -->
  <div class="overlay" id="detail-overlay" onclick="if(event.target==this)this.classList.remove('open')">
    <div class="modal" id="detail-modal-body"></div>
  </div>

  <!-- TORRENT HUB MODAL -->
  <div class="overlay" id="torrent-overlay" onclick="if(event.target==this)this.classList.remove('open')">
    <div class="modal torrent-hub-modal" id="torrent-modal-body"></div>
  </div>

  <script type="module">
    // FIREBASE CONFIGURATION
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCftljTkWcA2-CyojsF40Dpjm9rAiSlKNc",
      authDomain: "plexmovies-530e4.firebaseapp.com",
      projectId: "plexmovies-530e4",
      storageBucket: "plexmovies-530e4.firebasestorage.app",
      messagingSenderId: "890489788932",
      appId: "1:890489788932:web:7b606cb4a67ba70b23f351",
      measurementId: "G-ZBZ7YQ1GYR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const TMDB_KEY = '5e30970a964f6e59d184fa77433b17ca';

    let globalRequests = []; // Stores live Firestore data
    let currentMovies = []; // Stores current TMDB movie results
    let currentTVShows = []; // Stores current TMDB TV results
    let currentComingSoon = []; // Stores upcoming movies
    let currentTab = 'movies';

    // AUTO-REFRESH HELPERS
    const WEEK_MS = 7 * 24 * 60 * 60 * 1000; // 1 week
    const TWO_WEEKS_MS = 14 * 24 * 60 * 60 * 1000; // 2 weeks

    function shouldRefresh(key, maxAge) {
      const cached = localStorage.getItem(key);
      if (!cached) return true;
      const data = JSON.parse(cached);
      return Date.now() - data.timestamp > maxAge;
    }

    function cacheData(key, data) {
      localStorage.setItem(key, JSON.stringify({ data, timestamp: Date.now() }));
    }

    function getCached(key) {
      const cached = localStorage.getItem(key);
      return cached ? JSON.parse(cached).data : null;
    }

    function getLastRefresh(key) {
      const cached = localStorage.getItem(key);
      if (!cached) return 'Never';
      const timestamp = JSON.parse(cached).timestamp;
      const date = new Date(timestamp);
      return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function updateLastRefreshUI() {
      const mostRecent = Math.max(
        JSON.parse(localStorage.getItem('trending_movies') || '{"timestamp":0}').timestamp,
        JSON.parse(localStorage.getItem('trending_tv') || '{"timestamp":0}').timestamp,
        JSON.parse(localStorage.getItem('coming_soon') || '{"timestamp":0}').timestamp
      );

      if (mostRecent === 0) {
        document.getElementById('update-time').textContent = 'Just now';
      } else {
        const date = new Date(mostRecent);
        document.getElementById('update-time').textContent = date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
    }

    // 1. LISTEN TO FIREBASE REAL-TIME
    onSnapshot(query(collection(db, "requests"), orderBy("timestamp", "desc")), (snapshot) => {
      globalRequests = [];
      snapshot.forEach(doc => globalRequests.push(doc.data()));
      updateUI();
    });

    // 2. FETCH TRENDING MOVIES (with auto-refresh)
    async function fetchTrending() {
      // Check cache first
      if (!shouldRefresh('trending_movies', WEEK_MS)) {
        const cached = getCached('trending_movies');
        if (cached) {
          currentMovies = cached;
          renderGrid(currentMovies, 'grid-movies');
          updateLastRefreshUI();
          return;
        }
      }

      document.getElementById('loader-movies').style.display = 'flex';
      try {
        const res = await fetch(`https://api.themoviedb.org/3/trending/movie/week?api_key=${TMDB_KEY}`);
        const data = await res.json();
        currentMovies = data.results.map(m => ({ ...m, mediaType: 'movie' }));
        cacheData('trending_movies', currentMovies);
        renderGrid(currentMovies, 'grid-movies');
        updateLastRefreshUI();
      } catch (e) { console.error("TMDB Fetch Error", e); }
      document.getElementById('loader-movies').style.display = 'none';
    }

    // 3. FETCH TRENDING TV SHOWS (with auto-refresh)
    async function fetchTrendingTV() {
      // Check cache first
      if (!shouldRefresh('trending_tv', WEEK_MS)) {
        const cached = getCached('trending_tv');
        if (cached) {
          currentTVShows = cached;
          renderGrid(currentTVShows, 'grid-tvshows');
          updateLastRefreshUI();
          return;
        }
      }

      document.getElementById('loader-tv').style.display = 'flex';
      try {
        const res = await fetch(`https://api.themoviedb.org/3/trending/tv/week?api_key=${TMDB_KEY}`);
        const data = await res.json();
        currentTVShows = data.results.map(tv => ({
          ...tv,
          mediaType: 'tv',
          title: tv.name,
          release_date: tv.first_air_date
        }));
        cacheData('trending_tv', currentTVShows);
        renderGrid(currentTVShows, 'grid-tvshows');
        updateLastRefreshUI();
      } catch (e) { console.error("TMDB TV Fetch Error", e); }
      document.getElementById('loader-tv').style.display = 'none';
    }

    // 3B. FETCH COMING SOON MOVIES (with auto-refresh every 2 weeks)
    async function fetchComingSoon() {
      // Check cache first
      if (!shouldRefresh('coming_soon', TWO_WEEKS_MS)) {
        const cached = getCached('coming_soon');
        if (cached) {
          // Filter out past releases
          const today = new Date().toISOString().split('T')[0];
          currentComingSoon = cached.filter(m => m.release_date >= today);
          renderGrid(currentComingSoon, 'grid-coming');
          updateLastRefreshUI();
          return;
        }
      }

      document.getElementById('loader-coming').style.display = 'flex';
      try {
        const today = new Date().toISOString().split('T')[0];
        const futureDate = new Date();
        futureDate.setMonth(futureDate.getMonth() + 3);
        const future = futureDate.toISOString().split('T')[0];

        const res = await fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_KEY}&primary_release_date.gte=${today}&primary_release_date.lte=${future}&sort_by=popularity.desc`);
        const data = await res.json();
        currentComingSoon = data.results.map(m => ({ ...m, mediaType: 'movie' }));
        cacheData('coming_soon', currentComingSoon);
        renderGrid(currentComingSoon, 'grid-coming');
        updateLastRefreshUI();
      } catch (e) { console.error("TMDB Coming Soon Error", e); }
      document.getElementById('loader-coming').style.display = 'none';
    }

    // 4. SEARCH LOGIC
    document.getElementById('search').addEventListener('input', async (e) => {
      const val = e.target.value;
      if (val.length > 2) {
        if (currentTab === 'movies') {
          document.getElementById('movie-header').innerHTML = `<i class="fa-solid fa-magnifying-glass"></i> Search Results`;
          const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_KEY}&query=${encodeURIComponent(val)}`);
          const data = await res.json();
          currentMovies = data.results.map(m => ({ ...m, mediaType: 'movie' }));
          renderGrid(currentMovies, 'grid-movies');
        } else if (currentTab === 'tvshows') {
          document.getElementById('tv-header').innerHTML = `<i class="fa-solid fa-magnifying-glass"></i> Search Results`;
          const res = await fetch(`https://api.themoviedb.org/3/search/tv?api_key=${TMDB_KEY}&query=${encodeURIComponent(val)}`);
          const data = await res.json();
          currentTVShows = data.results.map(tv => ({
            ...tv,
            mediaType: 'tv',
            title: tv.name,
            release_date: tv.first_air_date
          }));
          renderGrid(currentTVShows, 'grid-tvshows');
        }
      } else if (val.length === 0) {
        if (currentTab === 'movies') {
          document.getElementById('movie-header').innerHTML = `<i class="fa-solid fa-fire"></i> Trending Movies`;
          fetchTrending();
        } else if (currentTab === 'tvshows') {
          document.getElementById('tv-header').innerHTML = `<i class="fa-solid fa-fire"></i> Trending TV Shows`;
          fetchTrendingTV();
        }
      }
    });

    // 5. GENRE/SORT FILTERS
    document.getElementById('movie-sort').addEventListener('change', async (e) => {
      const sort = e.target.value;
      if (sort === 'trending') fetchTrending();
      else if (sort === 'rating') {
        currentMovies.sort((a, b) => (b.vote_average || 0) - (a.vote_average || 0));
        renderGrid(currentMovies, 'grid-movies');
      } else if (sort === 'year') {
        currentMovies.sort((a, b) => (b.release_date || '').localeCompare(a.release_date || ''));
        renderGrid(currentMovies, 'grid-movies');
      } else if (sort === 'title') {
        currentMovies.sort((a, b) => a.title.localeCompare(b.title));
        renderGrid(currentMovies, 'grid-movies');
      }
    });

    document.getElementById('movie-genre').addEventListener('change', async (e) => {
      const genre = e.target.value;
      if (!genre) {
        fetchTrending();
      } else {
        const res = await fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_KEY}&with_genres=${genre}&sort_by=popularity.desc`);
        const data = await res.json();
        currentMovies = data.results.map(m => ({ ...m, mediaType: 'movie' }));
        renderGrid(currentMovies, 'grid-movies');
      }
    });

    document.getElementById('tv-sort').addEventListener('change', async (e) => {
      const sort = e.target.value;
      if (sort === 'trending') fetchTrendingTV();
      else if (sort === 'rating') {
        currentTVShows.sort((a, b) => (b.vote_average || 0) - (a.vote_average || 0));
        renderGrid(currentTVShows, 'grid-tvshows');
      } else if (sort === 'year') {
        currentTVShows.sort((a, b) => (b.release_date || '').localeCompare(a.release_date || ''));
        renderGrid(currentTVShows, 'grid-tvshows');
      } else if (sort === 'title') {
        currentTVShows.sort((a, b) => a.title.localeCompare(b.title));
        renderGrid(currentTVShows, 'grid-tvshows');
      }
    });

    document.getElementById('tv-genre').addEventListener('change', async (e) => {
      const genre = e.target.value;
      if (!genre) {
        fetchTrendingTV();
      } else {
        const res = await fetch(`https://api.themoviedb.org/3/discover/tv?api_key=${TMDB_KEY}&with_genres=${genre}&sort_by=popularity.desc`);
        const data = await res.json();
        currentTVShows = data.results.map(tv => ({
          ...tv,
          mediaType: 'tv',
          title: tv.name,
          release_date: tv.first_air_date
        }));
        renderGrid(currentTVShows, 'grid-tvshows');
      }
    });

    // 6. RENDERING CARDS
    function renderGrid(items, targetId) {
      const grid = document.getElementById(targetId);
      grid.innerHTML = '';
      if (!items || items.length === 0) {
        grid.innerHTML = `<p style="grid-column:1/-1; text-align:center; color:gray; padding:40px;">No items found.</p>`;
        return;
      }

      items.forEach(item => {
        const dbEntry = globalRequests.find(r => r.id === item.id && r.mediaType === item.mediaType);
        const isAdded = dbEntry?.status === 'added';
        const isPending = dbEntry?.status === 'pending';

        const card = document.createElement('div');
        card.className = `movie-card ${isAdded ? 'library-item' : ''}`;

        // Handle both TMDB format (poster_path) and stored format (poster full URL)
        let poster;
        if (item.poster_path) {
          poster = `https://image.tmdb.org/t/p/w500${item.poster_path}`;
        } else if (item.poster && item.poster.startsWith('http')) {
          poster = item.poster;
        } else {
          poster = 'https://via.placeholder.com/500x750/16161f/ffffff?text=No+Poster';
        }

        const year = item.release_date ? item.release_date.split('-')[0] : 'N/A';

        // Format release date for Coming Soon items
        let releaseDateBadge = '';
        if (targetId === 'grid-coming' && item.release_date) {
          const releaseDate = new Date(item.release_date);
          const formatted = releaseDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          releaseDateBadge = `<div class="priority-badge" style="background: var(--blue); left: auto; right: 10px;"><i class="fa-solid fa-calendar"></i> ${formatted}</div>`;
        }

        card.innerHTML = `
        <div class="poster-wrapper">
          <img src="${poster}" class="poster-img" loading="lazy">
          <div class="rating-badge"><i class="fa-solid fa-star"></i> ${item.vote_average?.toFixed(1) || 'NR'}</div>
          ${dbEntry?.priority === 'high' ? '<div class="priority-badge"><i class="fa-solid fa-fire"></i> HIGH</div>' : ''}
          ${releaseDateBadge}
        </div>
        <div class="card-content">
          <div class="movie-title">${item.title}</div>
          <div class="movie-year">${year}</div>
          ${dbEntry?.note ? `<div class="movie-note">"${dbEntry.note}"</div>` : ''}
          ${dbEntry?.requester ? `<div class="movie-year">Requested by: ${dbEntry.requester}</div>` : ''}
          <div class="btn-wrapper">
            ${isAdded ? '<button class="btn-card btn-status-available"><i class="fa-solid fa-circle-check"></i> Available</button>' :
            `<button class="btn-card btn-mark-added" onclick="event.stopPropagation(); window.saveItemFromObject(${JSON.stringify(item).replace(/"/g, '&quot;')}, 'added')"><i class="fa-solid fa-check"></i> Mark Available</button>
               <button class="btn-card btn-request ${isPending ? 'btn-status-requested' : ''}" onclick="event.stopPropagation(); if(!${isPending}) window.openRequestModal(${JSON.stringify(item).replace(/"/g, '&quot;')})">
                 ${isPending ? '<i class="fa-solid fa-hourglass-start"></i> Requested' : '<i class="fa-solid fa-plus"></i> Request'}
               </button>`}
          </div>
        </div>
      `;
        card.onclick = () => openDetail(item);
        grid.appendChild(card);
      });
    }

    // 7. REQUEST MODAL WITH NOTE & PRIORITY
    window.openRequestModal = (itemObj) => {
      const item = typeof itemObj === 'string' ? JSON.parse(itemObj) : itemObj;
      const overlay = document.getElementById('detail-overlay');
      overlay.innerHTML = `
      <div class="modal" style="max-width: 500px; padding: 40px;">
        <h2 style="margin-bottom: 20px;">Request: ${item.title}</h2>
        <input type="text" id="requester-name" class="modal-note-input" placeholder="Your name (optional)" style="height: 45px;">
        <textarea id="request-note" class="modal-note-input" placeholder="Add a note or reason for this request (optional)" rows="3"></textarea>
        <div style="margin-bottom: 15px;">
          <label style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 8px; display: block;">Priority Level:</label>
          <select id="request-priority" class="control-select" style="width: 100%;">
            <option value="normal">Normal</option>
            <option value="high">High Priority</option>
          </select>
        </div>
        <div style="display: flex; gap: 10px;">
          <button class="torrent-btn" style="flex: 1;" onclick="window.submitRequest(${JSON.stringify(item).replace(/"/g, '&quot;')})">
            <i class="fa-solid fa-paper-plane"></i> Submit Request
          </button>
          <button class="torrent-btn" style="background: #333;" onclick="document.getElementById('detail-overlay').classList.remove('open')">
            Cancel
          </button>
        </div>
      </div>
    `;
      overlay.classList.add('open');
    };

    window.submitRequest = async (itemObj) => {
      const item = typeof itemObj === 'string' ? JSON.parse(itemObj) : itemObj;
      const note = document.getElementById('request-note').value;
      const requester = document.getElementById('requester-name').value;
      const priority = document.getElementById('request-priority').value;

      await saveItemFromObject(item, 'pending', note, requester, priority);
      document.getElementById('detail-overlay').classList.remove('open');
    };

    // 8. DATABASE ACTIONS - Save complete item object
    window.saveItemFromObject = async (itemObj, status, note = '', requester = '', priority = 'normal') => {
      try {
        const item = typeof itemObj === 'string' ? JSON.parse(itemObj) : itemObj;
        await setDoc(doc(db, "requests", `${item.mediaType}_${item.id}`), {
          id: item.id,
          mediaType: item.mediaType || 'movie',
          title: item.title,
          poster_path: item.poster_path,
          backdrop_path: item.backdrop_path,
          overview: item.overview,
          release_date: item.release_date,
          vote_average: item.vote_average,
          status: status,
          note: note,
          requester: requester,
          priority: priority,
          timestamp: Date.now()
        });
      } catch (e) { console.error("Firebase Error", e); }
    };

    // 9. DELETE REQUEST
    window.deleteRequest = async (id) => {
      if (confirm('Are you sure you want to delete this request?')) {
        try {
          // Find the item to get its mediaType
          const item = globalRequests.find(r => r.id === id);
          if (item) {
            await deleteDoc(doc(db, "requests", `${item.mediaType}_${item.id}`));
            document.getElementById('detail-overlay').classList.remove('open');
          }
        } catch (e) { console.error("Delete Error", e); }
      }
    };

    // 10. UI UPDATES
    window.updateUI = function () {
      const pendingCount = globalRequests.filter(r => r.status === 'pending').length;
      document.getElementById('tab-count').innerText = pendingCount;

      // Refresh grids
      if (document.getElementById('view-movies').classList.contains('active')) {
        renderGrid(currentMovies, 'grid-movies');
      }
      if (document.getElementById('view-tvshows').classList.contains('active')) {
        renderGrid(currentTVShows, 'grid-tvshows');
      }
      if (document.getElementById('view-requests').classList.contains('active')) {
        renderRequestsGrid();
      }
      if (document.getElementById('view-stats').classList.contains('active')) {
        renderStats();
      }
    };

    // 11. RENDER REQUESTS WITH FILTERS
    function renderRequestsGrid() {
      const filter = document.getElementById('requests-filter').value;
      const sort = document.getElementById('requests-sort').value;

      let filtered = [...globalRequests];

      // Apply filter
      if (filter === 'pending') filtered = filtered.filter(r => r.status === 'pending');
      else if (filter === 'added') filtered = filtered.filter(r => r.status === 'added');

      // Apply sort
      if (sort === 'newest') filtered.sort((a, b) => b.timestamp - a.timestamp);
      else if (sort === 'oldest') filtered.sort((a, b) => a.timestamp - b.timestamp);
      else if (sort === 'title') filtered.sort((a, b) => a.title.localeCompare(b.title));
      else if (sort === 'priority') filtered.sort((a, b) => {
        if (a.priority === 'high' && b.priority !== 'high') return -1;
        if (a.priority !== 'high' && b.priority === 'high') return 1;
        return b.timestamp - a.timestamp;
      });

      renderGrid(filtered, 'grid-requests');
    }

    function renderStats() {
      const pending = globalRequests.filter(r => r.status === 'pending');
      const added = globalRequests.filter(r => r.status === 'added');
      const movies = globalRequests.filter(r => r.mediaType === 'movie');
      const tvShows = globalRequests.filter(r => r.mediaType === 'tv');
      const highPriority = globalRequests.filter(r => r.priority === 'high');

      const statsContainer = document.getElementById('stats-container');

      <div class="stat-card">
        <div class="stat-value">${globalRequests.length}</div>
        <div class="stat-label">Total Requests</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${pending.length}</div>
        <div class="stat-label">Pending</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${added.length}</div>
        <div class="stat-label">Available</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${movies.length}</div>
        <div class="stat-label">Movies</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${tvShows.length}</div>
        <div class="stat-label">TV Shows</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${highPriority.length}</div>
        <div class="stat-label">High Priority</div>
      </div>
    `;

    // 13. TAB SWITCHING
    window.switchTab = (tab) => {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`tab-${tab}-btn`).classList.add('active');
      document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
      document.getElementById(`view-${tab}`).classList.add('active');

      const searchBox = document.getElementById('search-box');
      document.getElementById('search').value = '';

      if (tab === 'movies') {
        searchBox.classList.remove('hidden');
        document.getElementById('search').placeholder = 'Search movies...';
        if (currentMovies.length === 0) fetchTrending();
        else renderGrid(currentMovies, 'grid-movies');
      } else if (tab === 'tvshows') {
        searchBox.classList.remove('hidden');
        document.getElementById('search').placeholder = 'Search TV shows...';
        if (currentTVShows.length === 0) fetchTrendingTV();
        else renderGrid(currentTVShows, 'grid-tvshows');
      } else if (tab === 'coming') {
        searchBox.classList.add('hidden');
        if (currentComingSoon.length === 0) fetchComingSoon();
        else renderGrid(currentComingSoon, 'grid-coming');
      } else if (tab === 'requests') {
        searchBox.classList.add('hidden');
        renderRequestsGrid();
      } else if (tab === 'stats') {
        searchBox.classList.add('hidden');
        renderStats();
      }
    };

    // 17. BULK MARK AVAILABLE
    window.bulkMarkAvailable = async () => {
      const titles = prompt('Enter movie/show titles to mark as available (one per line or comma-separated):');
      if (!titles) return;

      const titleList = titles.split(/[\n,]/).map(t => t.trim().toLowerCase());
      const matches = globalRequests.filter(r =>
        r.status === 'pending' && titleList.some(title => r.title.toLowerCase().includes(title))
      );

      if (matches.length === 0) {
        alert('No matching requests found.');
        return;
      }

      if (confirm(`Mark ${matches.length} item(s) as available?`)) {
        for (const item of matches) {
          await saveItemFromObject(item, 'added', item.note, item.requester, item.priority);
        }
        alert(`${matches.length} item(s) marked as available!`);
      }
    };

    // Start the app
    fetchTrending();
  </script>
</body>
