<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- PlexHub colorway: the same talons on the request site's near-black
       (#0a0a0f, its manifest background), so the two apps read as one family
       on a Home Screen while staying tellable apart. -->
  <defs>
    <linearGradient id="talon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6c445"/>
      <stop offset="0.55" stop-color="#e5a00d"/>
      <stop offset="1" stop-color="#b97f06"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15151d"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" fill="url(#tile)"/>
  <!-- a quiet gold baseline distinguishes the hub from the manager -->
  <rect x="9" y="40" width="30" height="1.6" rx="0.8" fill="#e5a00d" fill-opacity="0.55"/>
  <g fill="url(#talon)" transform="translate(5.5 3.2) scale(0.78)">
    <path d="M11 9 C 15 15, 20 24, 26 39 C 27.5 42.5, 24 43.5, 22.4 40.6 C 15.5 28.5, 11.5 18, 11 9 Z"/>
    <path d="M22 7 C 26.5 12.5, 31.5 21, 35.5 33 C 36.7 36.2, 33.4 37.2, 32 34.5 C 26.8 24.5, 23 14.5, 22 7 Z"/>
    <path d="M33 6.5 C 36.5 10.5, 40 16, 42.5 23.5 C 43.6 26.4, 40.5 27.4, 39.2 24.9 C 36 18, 33.8 12, 33 6.5 Z"/>
  </g>
</svg>
